services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: immo
      POSTGRES_DB: immo_inventory
    ports:
      - "5432:5432"
    volumes:
      - immo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo -d immo_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  immo_pgdata:
